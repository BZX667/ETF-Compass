[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etf-compass"
version = "0.1.0"
description = "A modular ETF research agent with systematic rotation, risk controls, and independent LLM evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = ["yfinance>=0.2.58"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
