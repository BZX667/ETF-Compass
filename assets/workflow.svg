<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
  <title id="title">ETF Compass strategy and AI research workflow</title>
  <desc id="description">Two parallel research paths: systematic strategy creates a portfolio plan, and AI research provides an independent evidence-based assessment. Both inform the daily report and weekly review.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .ink { fill: #26333A; }
      .muted { fill: #6E7A7D; }
      .step { font-size: 17px; font-weight: 650; }
      .lane { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
    </style>
    <marker id="arrow-strategy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E8990"/>
    </marker>
    <marker id="arrow-ai" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#82917E"/>
    </marker>
    <marker id="arrow-merge" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B2744F"/>
    </marker>
  </defs>
  <rect width="1200" height="550" rx="18" fill="#F4F1E9"/>
  <text x="48" y="48" class="sans" font-size="12" font-weight="700" letter-spacing="1.8" fill="#496A72">ETF COMPASS  /  RESEARCH WORKFLOW</text>
  <text x="48" y="84" class="sans ink" font-size="25" font-weight="700">系统化策略与 AI 研究，各自发挥优势并协同输出</text>

  <rect x="48" y="108" width="1104" height="54" rx="9" fill="#FFFEFA" stroke="#E5E1D8"/>
  <circle cx="76" cy="135" r="7" fill="#B2744F"/>
  <text x="96" y="141" class="sans step ink">最新行情与研究事实</text>
  <text x="1124" y="140" text-anchor="end" class="sans" font-size="13" fill="#6E7A7D">共同的数据起点 · 标注行情时点与覆盖范围</text>

  <rect x="48" y="180" width="1104" height="104" rx="11" fill="#EAF0EF"/>
  <rect x="48" y="180" width="7" height="104" rx="3.5" fill="#607E85"/>
  <text x="72" y="205" class="sans lane" fill="#496A72">系统化策略</text>
  <g fill="#FFFEFA" stroke="#D5E0DE">
    <rect x="72" y="220" width="286" height="46" rx="8"/>
    <rect x="430" y="220" width="286" height="46" rx="8"/>
    <rect x="788" y="220" width="286" height="46" rx="8"/>
  </g>
  <text x="215" y="249" text-anchor="middle" class="sans step ink">多信号评分</text>
  <text x="573" y="249" text-anchor="middle" class="sans step ink">ETF 筛选与轮动</text>
  <text x="931" y="249" text-anchor="middle" class="sans step ink">仓位预算与组合计划</text>
  <path d="M360 243 H420 M718 243 H778" fill="none" stroke="#6E8990" stroke-width="2" marker-end="url(#arrow-strategy)"/>

  <rect x="48" y="300" width="1104" height="104" rx="11" fill="#EEF0E9"/>
  <rect x="48" y="300" width="7" height="104" rx="3.5" fill="#82917E"/>
  <text x="72" y="325" class="sans lane" fill="#65775F">AI 研究分析</text>
  <g fill="#FFFEFA" stroke="#DCE1D7">
    <rect x="72" y="340" width="286" height="46" rx="8"/>
    <rect x="430" y="340" width="286" height="46" rx="8"/>
    <rect x="788" y="340" width="286" height="46" rx="8"/>
  </g>
  <text x="215" y="369" text-anchor="middle" class="sans step ink">多源事实梳理</text>
  <text x="573" y="369" text-anchor="middle" class="sans step ink">多空观点检验</text>
  <text x="931" y="369" text-anchor="middle" class="sans step ink">风险复核与独立评估</text>
  <path d="M360 363 H420 M718 363 H778" fill="none" stroke="#82917E" stroke-width="2" marker-end="url(#arrow-ai)"/>

  <path d="M1074 243 H1110 V426 H600 V448" fill="none" stroke="#B2744F" stroke-width="2" marker-end="url(#arrow-merge)"/>
  <path d="M1074 363 H1090 V426 H600" fill="none" stroke="#B2744F" stroke-width="2"/>
  <rect x="320" y="462" width="560" height="60" rx="11" fill="#B2744F"/>
  <text x="600" y="499" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#FFFEFA">可复核的组合计划 + 独立 AI 观点 → 日报与每周复盘</text>
</svg>
