<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title description">
  <title id="title">ETF Compass daily report preview</title>
  <desc id="description">A single illustrative daily ETF research brief with rotation, portfolio plan, AI summary, evidence and risks.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#26333A" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .serif { font-family: "Iowan Old Style", "Noto Serif SC", "Songti SC", Georgia, serif; }
      .ink { fill: #26333A; }
      .muted { fill: #6E7A7D; }
      .label { font-size: 14px; font-weight: 600; }
      .body { font-size: 16px; }
      .rule { stroke: #E5E1D8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="1060" rx="18" fill="#F4F1E9"/>
  <rect x="0" y="0" width="1200" height="10" rx="5" fill="#496A72"/>
  <g filter="url(#shadow)"><rect x="54" y="46" width="1092" height="968" rx="12" fill="#FFFEFA"/></g>
  <rect x="54" y="46" width="8" height="968" rx="4" fill="#496A72"/>

  <text x="91" y="94" class="sans" font-size="12" font-weight="700" letter-spacing="1.7" fill="#496A72">ETF COMPASS  /  DAILY RESEARCH BRIEF</text>
  <rect x="910" y="69" width="198" height="32" rx="16" fill="#F2EAE3"/>
  <circle cx="929" cy="85" r="4" fill="#B2744F"/>
  <text x="943" y="90" class="sans" font-size="11" font-weight="700" letter-spacing=".7" fill="#80634F">虚构数据 · 样式预览</text>
  <text x="91" y="148" class="serif ink" font-size="34" font-weight="600">市场收盘简报</text>
  <text x="91" y="181" class="sans muted" font-size="15">2026 年 10 月 14 日　·　行情截至 15:00（示例）</text>
  <rect x="91" y="202" width="1017" height="48" rx="8" fill="#F3F5F1"/>
  <text x="111" y="232" class="sans label" fill="#496A57">覆盖范围</text>
  <text x="198" y="232" class="sans body ink">主要观察 ETF</text>
  <text x="1086" y="232" text-anchor="end" class="sans" font-size="13" fill="#6E7A7D">行情与事实按决策时点更新</text>

  <text x="91" y="294" class="sans" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6E7A7D">轮动组合与目标仓位</text>
  <rect x="91" y="312" width="1017" height="42" rx="6" fill="#EAF0EF"/>
  <text x="111" y="339" class="sans label" fill="#496A72">排名</text>
  <text x="185" y="339" class="sans label" fill="#496A72">ETF</text>
  <text x="438" y="339" class="sans label" fill="#496A72">信号</text>
  <text x="824" y="339" text-anchor="end" class="sans label" fill="#496A72">得分</text>
  <text x="1084" y="339" text-anchor="end" class="sans label" fill="#496A72">目标仓位</text>

  <circle cx="124" cy="393" r="14" fill="#E8EFEA"/><text x="124" y="398" text-anchor="middle" class="sans label" fill="#496A57">1</text>
  <text x="185" y="399" class="sans body ink" font-weight="700">510300</text><text x="270" y="399" class="sans body muted">沪深 300 ETF</text>
  <rect x="438" y="377" width="112" height="27" rx="13.5" fill="#E8EFEA"/><text x="494" y="395" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#496A57">动量改善</text>
  <text x="824" y="399" text-anchor="end" class="sans body ink">0.7800</text><text x="1084" y="399" text-anchor="end" class="sans body ink" font-weight="700">35%</text>
  <line x1="91" y1="425" x2="1108" y2="425" class="rule"/>

  <circle cx="124" cy="464" r="14" fill="#EEF0F1"/><text x="124" y="469" text-anchor="middle" class="sans label" fill="#58676C">2</text>
  <text x="185" y="470" class="sans body ink" font-weight="700">513100</text><text x="270" y="470" class="sans body muted">纳指 100 ETF</text>
  <rect x="438" y="448" width="112" height="27" rx="13.5" fill="#EEF0F1"/><text x="494" y="466" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#58676C">趋势偏强</text>
  <text x="824" y="470" text-anchor="end" class="sans body ink">0.6900</text><text x="1084" y="470" text-anchor="end" class="sans body ink" font-weight="700">30%</text>
  <line x1="91" y1="496" x2="1108" y2="496" class="rule"/>

  <circle cx="124" cy="535" r="14" fill="#F2EAE3"/><text x="124" y="540" text-anchor="middle" class="sans label" fill="#98684F">3</text>
  <text x="185" y="541" class="sans body ink" font-weight="700">511010</text><text x="270" y="541" class="sans body muted">国债 ETF</text>
  <rect x="438" y="519" width="112" height="27" rx="13.5" fill="#F2EAE3"/><text x="494" y="537" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#98684F">防御配置</text>
  <text x="824" y="541" text-anchor="end" class="sans body ink">0.5100</text><text x="1084" y="541" text-anchor="end" class="sans body ink" font-weight="700">20%</text>
  <line x1="91" y1="567" x2="1108" y2="567" class="rule"/>

  <rect x="91" y="592" width="1017" height="98" rx="8" fill="#F7F3EB"/>
  <text x="114" y="621" class="sans" font-size="12" font-weight="700" letter-spacing="1.2" fill="#98684F">系统化策略计划</text>
  <text x="114" y="651" class="sans body ink">趋势信号整体平稳，组合保留部分现金空间；单项仓位受风险预算约束。</text>
  <text x="114" y="675" class="sans" font-size="13" fill="#6E7A7D">信号使用决策时点可得数据，权重依据波动目标和组合上限计算。</text>

  <rect x="91" y="710" width="1017" height="258" rx="8" fill="#EEF2EF"/>
  <rect x="91" y="710" width="5" height="258" rx="2.5" fill="#6D8B78"/>
  <text x="114" y="742" class="sans" font-size="12" font-weight="700" letter-spacing="1.2" fill="#496A57">AI 研究摘要</text>
  <text x="114" y="777" class="sans body ink" font-weight="700">立场：中性　·　信心：中等</text>
  <text x="114" y="812" class="sans label" fill="#52656A">支持依据</text>
  <circle cx="122" cy="838" r="3" fill="#6D8B78"/><text x="137" y="843" class="sans body ink">主要指数趋势尚稳，轮动信号保持正向。</text>
  <text x="114" y="879" class="sans label" fill="#52656A">风险因素</text>
  <circle cx="122" cy="905" r="3" fill="#B2744F"/><text x="137" y="910" class="sans body ink">短期波动上升，海外利率变化仍需观察。</text>
  <text x="114" y="945" class="sans label" fill="#52656A">后续观察</text>
  <text x="232" y="945" class="sans body ink">核实数据覆盖；若波动继续扩大，重新评估风险预算。</text>

  <text x="91" y="993" class="sans" font-size="12" fill="#87918E">ETF Compass · 研究参考，请结合实际数据独立判断</text>
  <text x="1108" y="993" text-anchor="end" class="sans" font-size="11" font-weight="700" letter-spacing="1" fill="#496A72">SAMPLE REPORT</text>
</svg>
